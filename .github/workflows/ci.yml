name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Ink 7 declares `engines: {node: '>=22'}`. Pinned rather than
          # floating so a Node release cannot turn a green branch red.
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Compiles src/ and fails the check on a type error.
      - name: Build
        run: npm run build

      # Test files are excluded from the build, so this is what catches type
      # errors in them.
      - name: Typecheck tests
        run: npm run typecheck

      - name: Test
        run: npm test
