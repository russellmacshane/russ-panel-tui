name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    permissions:
      contents: read

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Ink 7 declares `engines: {node: '>=22'}`. Pinned rather than
          # floating so a Node release cannot turn a green branch red.
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Compiles src/ and fails the check on a type error.
      - name: Build
        run: npm run build

      # Test files are excluded from the build, so this is what catches type
      # errors in them.
      - name: Typecheck tests
        run: npm run typecheck

      - name: Test
        run: npm test

  publish:
    needs: test

    permissions:
      contents: read
      id-token: write

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Ink 7 declares `engines: {node: '>=22'}`. Pinned rather than
          # floating so a Node release cannot turn a green branch red.
          # No registry-url here: trusted publishing needs no
          # NODE_AUTH_TOKEN, and setting registry-url would make
          # setup-node write an .npmrc referencing that unset var, which
          # can break auth instead of falling back to OIDC.
          node-version: '22.x'

      - name: Install dependencies
        run: npm ci

      # Trusted publishing requires npm >= 11.5.1, but the latest Node
      # 22.x currently bundles npm 10.9.8, which is below that floor.
      - name: Install npm 11
        run: |
          npm install -g npm@11
          npm --version

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)"
            exit 1
          fi

      - name: Publish
        run: npm publish --provenance
